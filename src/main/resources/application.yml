spring:
  config:
    # Same mechanism NestJS v2 gets for free by reading .env from the project root — without it,
    # this service had no way to pick up the Atlas connection string and silently fell back to a
    # local Mongo that no longer exists. Gitignored, so the credential never lands in the repo,
    # a shell history, or `ps` output. Matches store-engine-v2.
    import: optional:file:.env[.properties]
  data:
    mongodb:
      # No localhost fallback, deliberately: with one, a missing MONGODB_URI started the service
      # against a non-existent local Mongo and every auth call hung, instead of failing at startup.
      # Fail loudly, the same stance master-data-service takes.
      uri: ${MONGODB_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
server:
  # 9081, matching NestJS v2 and what every client here already targets: the frontend, plus
  # master-data-service and store-engine-v2's auth-server-url. A 9082 default meant a start
  # without PORT set left the service listening where nothing looked for it.
  port: ${PORT:9081}
  address: 0.0.0.0
app:
  # Comma-separated tenants this instance serves; each has its own authentication-<customer> DB.
  # Defaults to the tenant this deployment is for, and the X-Customer value the frontend sends in
  # every environment. The previous `dearlavion` default silently rejected every real request with
  # 400 "Unknown customer" whenever CUSTOMERS wasn't set — see TenantService.assertCustomer.
  customers: ${CUSTOMERS:travelbesty}
  # The tenant that holds SUPERADMIN accounts and backs /superadmin/**. It must also be listed in CUSTOMERS.
  security-tenant: ${SECURITY_TENANT:security}
  # Secret required (via X-Provision-Secret) to set a privileged role at register/update time.
  # Empty => privileged roles can never be assigned through the API (fail closed).
  provision-secret: ${PROVISION_SECRET:}
  # Base64 HMAC secret. Defaults to the exact key the Java v1 JwtService bakes in and the NestJS v2
  # configuration.ts falls back to (V1_JWT_KEY), so v1-, v2- and v3-issued tokens interoperate out
  # of the box — same rule v2 follows. Override JWT_SECRET per environment; anywhere the secret
  # actually matters it must be set, since this default is in public source.
  jwt-secret-base64: ${JWT_SECRET:5B6F7D3E2A9C4B8E0A1F6D9B3E7A2C9D4F8E5B6C3A7B1D6F4C9A3E8D2B5F7A1}
  jwt-expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:86400}
  jwt-reset-expires-in-seconds: ${JWT_RESET_EXPIRES_IN_SECONDS:900}
  # Shared secret other backends send (X-Service-Key) to look users up by id/username. Empty => disabled.
  service-key: ${SERVICE_KEY:}
  # Cookie-backed sessions (POST /auth/session/*): a short access token plus a rotating refresh token
  # in an httpOnly cookie. The cookie path must be the path the BROWSER sees (e.g. /api/v1/auth when
  # a UI proxies /api/v1/auth/* to this service), so it is deployment config, not code.
  session-access-ttl-seconds: ${SESSION_ACCESS_TTL_SECONDS:900}
  session-refresh-ttl-days: ${SESSION_REFRESH_TTL_DAYS:14}
  session-cookie-name: ${SESSION_COOKIE_NAME:dl_refresh}
  session-cookie-path: ${SESSION_COOKIE_PATH:/auth}
  session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
  kafka-enabled: ${KAFKA_ENABLED:true}
  kafka-client-id: ${KAFKA_CLIENT_ID:dearlavion-spring-authentication-service-v3}
  google-enabled: ${GOOGLE_ENABLED:true}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  frontend-origins: ${FRONTEND_ORIGINS:}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
